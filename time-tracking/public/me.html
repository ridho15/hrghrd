<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#047857">
  <title>Data Saya · Time Tracking HR Group</title>
  <link rel="preload" href="/fonts/plus-jakarta-sans-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/plus-jakarta-sans-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <p class="brand"><b>HR Group</b><span>Time Tracking</span></p>
      <div class="session hidden" id="session">
        <span class="session-user" id="session-user"></span>
        <button type="button" class="btn btn-quiet" id="logout">Keluar</button>
      </div>
    </div>
  </header>

  <main class="page page-solo">
    <div class="page-head">
      <div>
        <h1 id="page-title">Data saya</h1>
        <p id="page-sub">Lihat waktu kerja Anda sendiri dan kirim timesheet.</p>
      </div>
    </div>

    <section id="login" class="login" aria-labelledby="login-title">
      <form id="login-form" class="panel">
        <h2 id="login-title">Masuk dengan token</h2>
        <p class="section-desc">Token yang sama dengan yang dipasang di agent komputer Anda. Mintalah ke admin HR bila belum punya.</p>
        <div class="form-grid">
          <label class="field"><span>Token agent</span>
            <input id="token" type="password" autocomplete="off" required>
          </label>
          <button type="submit" class="btn btn-primary btn-block">Lihat data saya</button>
          <p id="login-error" class="form-msg is-error" role="alert"></p>
        </div>
      </form>
    </section>

    <div id="app" class="hidden">
      <div class="filters filters-single">
        <label class="field"><span>Tanggal</span><input type="date" id="day"></label>
      </div>
      <div id="view" aria-live="polite"></div>
    </div>
  </main>

  <script src="/me.js"></script>
</body>
</html>
